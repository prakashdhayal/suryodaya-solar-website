# Builds the site and publishes it on GitHub Pages on every push to main (the custom domain is set in Settings › Pages),
# and again every night just after midnight in India, so a notice leaves the site the day after its showUntil day.
# Google Analytics and Search Console switch on from the repository's variables (Settings › Secrets and variables ›
# Actions › Variables): GA_ID (G-XXXXXXX) and GOOGLE_SITE_VERIFICATION - both optional.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '35 18 * * *' # 00:05 in India
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # resized photos from earlier builds, so a new week's photos are the only ones processed
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-assets-
      - run: npm run build
        env:
          PUBLIC_GA_ID: ${{ vars.GA_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
